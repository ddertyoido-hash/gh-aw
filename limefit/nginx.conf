# Serves the LimeFit web app (the same assets the APK bundles) plus the built
# APK itself, so the installer can be downloaded and side-loaded on a phone.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Android package the builder writes into limefit/dist.
    location = /LimeFit.apk {
        alias /srv/apk/LimeFit.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="LimeFit.apk"';
        add_header Cache-Control 'no-store';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
