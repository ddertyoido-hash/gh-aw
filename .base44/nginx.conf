# Base44 preview front door for the gh-aw documentation site.
#
# The Astro/Starlight dev server serves the site under the `/gh-aw/` base path
# (see `base` in docs/astro.config.mjs), so a request for the preview root would
# 404. This proxy rewrites that single path to the base path and forwards
# everything else to the dev server unchanged, including the HMR WebSocket.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep long-lived dev-server connections (HMR, streaming) alive.
    proxy_read_timeout 3600s;
    proxy_buffering off;

    # Preview root -> docs home page.
    location = / {
        rewrite ^ /gh-aw/ break;
        proxy_pass http://docs:4321;
    }

    # The standalone editor is a static directory in the docs `public/` folder;
    # the dev server does not serve its index for the bare directory URL.
    location = /gh-aw/editor/ {
        rewrite ^ /gh-aw/editor/index.html break;
        proxy_pass http://docs:4321;
    }

    location / {
        proxy_pass http://docs:4321;
    }
}
